services:
  mongodb:
    image: mongo:latest
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - db-data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - manager-point-network
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "const h = db.adminCommand({ hello: 1 }); if (h.setName !== 'rs0' || !h.isWritablePrimary) quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - manager-point-network
    restart: always

  prometheus:
    image: prom/prometheus
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - manager-point-network
    restart: always

  grafana:
    image: grafana/grafana
    profiles:
      - monitoring
    ports:
      - "3001:3000"
    networks:
      - manager-point-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=8001
      - MONGO_URI=mongodb://mongodb:27017/manager-point?replicaSet=rs0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET}
      - SYSTEM_ADMIN_EMAIL=${SYSTEM_ADMIN_EMAIL}
      - SYSTEM_ADMIN_USERNAME=${SYSTEM_ADMIN_USERNAME}
      - SYSTEM_ADMIN_PASSWORD=${SYSTEM_ADMIN_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - manager-point-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - manager-point-network

networks:
  manager-point-network:
    driver: bridge

volumes:
  db-data:
