services:
  backend:
    build:
      target: development
    volumes: !override
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 8001
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      JWT_SECRET: ${JWT_SECRET}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL}
      SYSTEM_ADMIN_USERNAME: ${SYSTEM_ADMIN_USERNAME}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD}

  frontend:
    build:
      target: development
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    cpus: "${FRONTEND_DEV_CPUS:-1.5}"
    mem_limit: "${FRONTEND_DEV_MEMORY:-2g}"
    pids_limit: ${FRONTEND_DEV_PIDS:-512}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8001
      WATCHPACK_POLLING: "true"

volumes:
  backend-node-modules:
  frontend-node-modules:
  frontend-next:
